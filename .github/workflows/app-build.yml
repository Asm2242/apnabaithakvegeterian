name: Build Android APKs

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - "rider/**"
      - "mobile-customer/**"
      - "mobile-rider/**"
      - ".github/workflows/app-build.yml"

jobs:
  customer:
    name: Customer APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build website
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Setup wrapper
        working-directory: mobile-customer
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx -p @capacitor/assets@3 capacitor-assets generate --iconBackgroundColor '#3b1d0c' --splashBackgroundColor '#3b1d0c' || true
          sed -i 's|<application|  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n  <application|' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: mobile-customer/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apna-baithak-customer-apk
          path: mobile-customer/android/app/build/outputs/apk/debug/app-debug.apk

  rider:
    name: Rider APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build website
        working-directory: rider
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Setup wrapper
        working-directory: mobile-rider
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx -p @capacitor/assets@3 capacitor-assets generate --iconBackgroundColor '#3b1d0c' --splashBackgroundColor '#3b1d0c' || true
          sed -i 's|<application|  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n  <application|' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: mobile-rider/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: baithak-rider-apk
          path: mobile-rider/android/app/build/outputs/apk/debug/app-debug.apk
